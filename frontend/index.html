<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrystalCave 💎🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CrystalCave💎🌸</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h2>Welcome to MyShop!</h2>
      <p>Find your favorite crystals in one place 🌸</p>
      <button id="shopBtn">Shop Now</button>
    </div>
  </section>

  <section class="products">
    <div class="product-card">
      <img src="./assets/product1.png" alt="Product 1">
      <div class="info">
        <h3>Product 1</h3>
        <p>₹200</p>
      </div>
    </div>
    <div class="product-card">
      <img src="./assets/product2.png" alt="Product 2">
      <div class="info">
        <h3>Product 2</h3>
        <p>₹500</p>
      </div>
    </div>
    <div class="product-card">
      <img src="./assets/product3.png" alt="Product 3">
      <div class="info">
        <h3>Product 3</h3>
        <p>₹600</p>
      </div>
    </div>
    <div class="product-card">
      <img src="./assets/product4.png" alt="Product 4">
      <div class="info">
        <h3>Product 4</h3>
        <p>₹400</p>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2025 MyShop. All rights reserved 🌸
  </footer>

  <script src="script.js"></script>
</body>
</html>
