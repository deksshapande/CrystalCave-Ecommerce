<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login ✨
  </title>

  <link
    rel="stylesheet"
    href="style-new.css"
  >

</head>

<body>

<section class="auth-section">

  <div class="auth-box">

    <h2>
      Welcome Back 💎
    </h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

    <p>
      Don't have an account?

      <a href="signup.html">
        Signup
      </a>
    </p>

  </div>

</section>

<script src="login.js"></script>

</body>
</html>
